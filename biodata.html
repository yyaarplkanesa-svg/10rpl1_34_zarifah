gitnggit <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Biodata</title>
</head>
<body>

  <h2>BIODATA<
    <h2>

  <form action="#" method="POST">
    
    <label for="nama">Nama:</label><br>
    <input type="text" id="nama" name="nama"><br><br>

    <label for="alamat">Alamat:</label><br>
    <textarea id="alamat" name="alamat"></textarea><br><br>

    <label for="jurusan">Jurusan:</label><br>
    <select id="jurusan" name="jurusan">
      <option value="RPL" selected>RPL</option>
      <option value="TKJ">TKJ</option>
      <option value="MM">MM</option>
    </select><br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki" checked>
    <label for="laki">Laki-laki</label>
    
    <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
    <label for="perempuan">Perempuan</label>
    
    <input type="radio" id="boti" name="jenis_kelamin" value="Boti">
    <label for="boti">Boti</label><br><br>

    <label for="tinggi">Tinggi Badan (cm):</label><br>
    <input type="number" id="tinggi" name="tinggi_badan"><br><br>

    <label for="berat">Berat Badan (kg):</label><br>
    <input type="number" id="berat" name="berat_badan"><br><br>

    <label for="hobi">Hobi:</label><br>
    <input type="text" id="hobi" name="hobi"><br><br>

    <label for="nohp">No. HP:</label><br>
    <input type="text" id="nohp" name="no_hp"><br><br>

    <button type="submit">Simpan</button>

  </form>

</body>
</html>
